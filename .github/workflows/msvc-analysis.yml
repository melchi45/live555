name: Microsoft C++ Code Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '45 8 * * 2'

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  OUT_PATH: install
  CHECKOUT_REF: 'v103.0.13'
  # ARCHIVE_NAME: ${{ github.event.repository.name }}-${{env.CHECKOUT_REF}}
  ARCHIVE_NAME: ${{ github.event.repository.name }}  

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DLIVE555_ENABLE_OPENSSL=OFF

      # Build is not required unless generated source files are used
      # - name: Build CMake
      #   run: cmake --build ${{ env.build }}

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # msvc-code-analysis-action runs the analyzer once per compile target,
      # producing one SARIF "run" per target (this repo has far more than
      # that). GitHub Code Scanning rejects any upload with more than 20
      # runs, so merge the same-tool runs into one before uploading. The
      # action itself never picked up this fix; see
      # https://github.com/microsoft/msvc-code-analysis-action/issues/25
      - name: Merge SARIF runs
        shell: bash
        run: |
          dotnet tool install --global Sarif.Multitool --version 5.7.0
          sarif merge "${{ steps.run-analysis.outputs.sarif }}" \
            --output-directory "${{ env.build }}" \
            --output-file results-merged.sarif \
            --log ForceOverwrite

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.build }}/results-merged.sarif

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
